            .portrait {
                animation: reveal 2.8s ease-out forwards;
                transform-origin: center;
            }

            @keyframes reveal {
                0% {
                    opacity: 0;
                    clip-path: inset(100% 0 0 0);
                    transform: translate(55px, 18px);
                }

                70% {
                    opacity: 1;
                }

                100% {
                    opacity: 1;
                    clip-path: inset(0 0 0 0);
                    transform: translate(55px, 0);
                }
            }
        </style>
    </defs>

